<body class="chapter-page">

  <!-- Shared chrome is built by GameEngine.chapter.build() in chapter8.js.
       Only the jigsaw puzzle modal lives here. -->

  <!-- ════════════════════════════════════════════════════════════
       DAS LETZTE BILD — a real tap-to-swap jigsaw (the 10th puzzle)
       ════════════════════════════════════════════════════════════ -->
  <div class="puzzle-modal hidden" id="jigModal">
    <div class="puzzle-card jig-card">
      <div class="puzzle-card-accent"></div>
      <div class="puzzle-header">
        <p class="puzzle-label sys-text">DAS LETZTE BILD // AGN-H3R</p>
        <h2 class="puzzle-title">DAS ZEHNTE PUZZLE</h2>
        <p class="puzzle-sub sys-text">TIPPE ZWEI TEILE, UM SIE ZU TAUSCHEN</p>
      </div>

      <div class="jig-board" id="jigBoard"></div>

      <div class="jig-bar">
        <span class="sys-text" id="jigCount">0 / 16 AN ORT</span>
        <button class="ka-btn small" id="jigPeek" onclick="Chapter8.jigPeek()">[ VORLAGE ]</button>
      </div>

      <div class="puzzle-status sys-text" id="jigStatus"></div>
      <div class="puzzle-actions">
        <button class="ka-btn small" onclick="Chapter8.jigShuffle()">[ NEU MISCHEN ]</button>
      </div>
    </div>
  </div>

  <script src="../js/engine.js?v=20260611"></script>
  <script src="../js/mobile-warning.js?v=20260611"></script>
  <script src="chapter8.js?v=20260611"></script>
