<body class="chapter-page">

  <!-- The shared chrome is built by GameEngine.chapter.build() in chapter5.js.
       Only the FÖRDERLAUF puzzle modal lives here. -->

  <!-- ════════════════════════════════════════════════════════════
       FÖRDERLAUF — 20 rapid mixed micro-tasks under one clock
       ════════════════════════════════════════════════════════════ -->
  <div class="puzzle-modal hidden" id="flModal">
    <div class="puzzle-card fl-card" id="flCard">
      <div class="puzzle-card-accent"></div>
      <div class="puzzle-header">
        <p class="puzzle-label sys-text">FÖRDERLAUF // T-FLON14</p>
        <h2 class="puzzle-title">DIE STRECKE</h2>
        <p class="puzzle-sub sys-text">20 PRÜFUNGEN · EINE UHR · NICHT STEHENBLEIBEN</p>
      </div>

      <div class="fl-bar">
        <div class="fl-timer-track"><div class="fl-timer-fill" id="flTimer"></div></div>
        <span class="sys-text" id="flTimeLabel">60s</span>
      </div>
      <div class="fl-progress sys-text" id="flProgress">RUNDE 1 / 20</div>

      <div class="fl-prompt" id="flPrompt"></div>
      <div class="fl-grid" id="flGrid"></div>
      <div class="fl-answers hidden" id="flAnswers"></div>

      <div class="puzzle-status sys-text" id="flStatus"></div>
      <div class="puzzle-actions">
        <button class="ka-btn primary hidden" id="flRestart" onclick="Chapter5.flRestart()">[ NEU STARTEN ]</button>
      </div>
    </div>
  </div>

  <script src="../js/engine.js?v=20260613"></script>
  <script src="../js/mobile-warning.js?v=20260613"></script>
  <script src="chapter5.js?v=20260613"></script>
