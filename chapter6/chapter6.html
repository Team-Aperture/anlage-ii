<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KA-II // Kapitel 6 — Dunkelkammer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400;500;600;700&family=Barlow:ital,wght@0,300;0,400;1,300&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css?v=20260611">
  <link rel="stylesheet" href="../css/chapter.css?v=20260611">
  <link rel="stylesheet" href="chapter6.css?v=20260611">
</head>
<body class="chapter-page">

  <!-- The shared chrome (sys-bar, title card, scene, choices, hint bar,
       chapter-complete) is built by GameEngine.chapter.build() in chapter6.js.
       Only the chapter's own puzzle modal lives here. -->

  <!-- ════════════════════════════════════════════════════════════
       BILDFORENSIK — steganography (canvas channels + threshold)
       ════════════════════════════════════════════════════════════ -->
  <div class="puzzle-modal hidden" id="stegModal">
    <div class="puzzle-card steg-card" id="stegCard">
      <div class="puzzle-card-accent"></div>
      <div class="puzzle-header">
        <p class="puzzle-label sys-text">BILDFORENSIK // ASP-1024</p>
        <h2 class="puzzle-title">DAS VERSTECKTE BILD</h2>
        <p class="puzzle-sub sys-text">VIER SPALTEN · KANAL · INVERT · FLIP · SCHWELLE</p>
      </div>

      <div class="steg-canvas-wrap">
        <canvas id="stegCanvas" width="280" height="110"></canvas>
      </div>

      <div class="steg-controls">
        <div class="steg-channels" id="stegChannels">
          <button class="steg-ch active" data-ch="rgb" onclick="Chapter6.stegChannel('rgb')">RGB</button>
          <button class="steg-ch" data-ch="r" onclick="Chapter6.stegChannel('r')">ROT</button>
          <button class="steg-ch" data-ch="g" onclick="Chapter6.stegChannel('g')">GRÜN</button>
          <button class="steg-ch" data-ch="b" onclick="Chapter6.stegChannel('b')">BLAU</button>
          <button class="steg-toggle" id="stegInvertBtn" onclick="Chapter6.stegInvert()">INVERT</button>
          <button class="steg-toggle" id="stegFlipBtn" onclick="Chapter6.stegFlip()">FLIP</button>
        </div>
        <div class="steg-thresh">
          <span class="sys-text">SCHWELLE</span>
          <input type="range" id="stegThreshold" min="0" max="255" value="0" step="1"
                 oninput="Chapter6.stegThreshold(this.value)" aria-label="Schwelle">
          <span class="sys-text" id="stegThreshLabel">AUS</span>
        </div>
      </div>

      <div class="steg-answer">
        <input type="text" id="stegInput" class="steg-input" maxlength="4" placeholder="CODE (4)"
               autocomplete="off" aria-label="Code">
        <button class="ka-btn primary" onclick="Chapter6.stegSubmit()">[ ENTSCHLÜSSELN ]</button>
      </div>

      <div class="puzzle-status sys-text" id="stegStatus"></div>
      <div class="puzzle-actions">
        <button class="ka-btn small" onclick="Chapter6.stegReset()">[ ANSICHT ZURÜCKSETZEN ]</button>
      </div>
    </div>
  </div>

  <script src="../js/engine.js?v=20260611"></script>
  <script src="../js/mobile-warning.js?v=20260611"></script>
  <script src="chapter6.js?v=20260611"></script>
</body>
</html>
